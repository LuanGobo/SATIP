root = "."
tmp_dir = "tmp"

[build]
  # Ajustado para compilar o main.go dentro da pasta cmd
  cmd = "go build -o ./tmp/main ./cmd"
  
  bin = "./tmp/main"
  
  # Extensões para observar
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  
  # Pastas para ignorar (tmp é crucial ignorar para evitar loop infinito)
  exclude_dir = ["assets", "tmp", "vendor"]
  
  stop_on_error = false
  delay = 1000 

[log]
  time = true